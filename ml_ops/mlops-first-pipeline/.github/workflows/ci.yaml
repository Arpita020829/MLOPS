# Github actions workflow 
# Github automatically looks for workflow file inside .github/workflows/

#give workflow a meaningful name

name: Iris ML API - CI Pipeline

#define when Github should run this workfloe 
on:
  #Run CI whenever code is pushed to main branch
  push:
    branches:
      - main

      #also validate proposed changes before they are merged
    pull_request:
      branches:
        - main
#
permissions:
  contents: read
#define the jobs that make up the pipeline
jobs:
  test-and-build:
    #Github provides a fresh Ubuntu VM for this job
    runs-on: ubuntu-latest
    #steps
    steps:
      #step 1: Download the repo content to the runner
      - name: Check out repository
        uses: actions/checkout@v4

      #Step 2: Install Python on runner
      - name: Install Python on Runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run tests
      - name: Run automated tests
        run:  python -m pytest -v

      # Step 5: Build Docker image
      - name: Build Docker image
        run: docker build -t iris-ml-api:${{github.sha}} .